name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Validate 16 MiB partition layout
        shell: bash
        run: |
          set -o pipefail
          python tools/check_partition.py 2>&1 | tee partition-check.log

      - name: Validate embedded Web UI
        shell: bash
        run: |
          set -o pipefail
          python tools/check_web_ui.py 2>&1 | tee web-ui-check.log

      - name: Run native unit tests
        shell: bash
        run: |
          set -o pipefail
          pio test -e native 2>&1 | tee native-test.log

      - name: Build ESP32-C6 firmware
        shell: bash
        run: |
          set -o pipefail
          pio run -e esp32-c6-devkitc-1 2>&1 | tee firmware-build.log

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            partition-check.log
            web-ui-check.log
            native-test.log
            firmware-build.log
          if-no-files-found: ignore
