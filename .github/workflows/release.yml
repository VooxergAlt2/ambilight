name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  firmware-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Validate release candidate
        shell: bash
        run: bash tools/validate.sh

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          BUILD=.pio/build/esp32-c6-devkitc-1
          RELEASE=release
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"

          test -f "$NOTES"
          mkdir -p "$RELEASE"

          cp "$BUILD/firmware.bin" "$RELEASE/firmware.bin"
          cp "$BUILD/firmware.factory.bin" "$RELEASE/firmware.factory.bin"
          cp "$BUILD/bootloader.bin" "$RELEASE/bootloader.bin"
          cp "$BUILD/partitions.bin" "$RELEASE/partitions.bin"
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" "$RELEASE/boot_app0.bin"

          (cd "$RELEASE" && sha256sum *.bin > SHA256SUMS.txt)
          ls -lh "$RELEASE"
          cat "$RELEASE/SHA256SUMS.txt"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "Ambilight ESP32-C6 ${GITHUB_REF_NAME}" \
              --notes-file "$NOTES"
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --title "Ambilight ESP32-C6 ${GITHUB_REF_NAME}" \
              --notes-file "$NOTES" \
              --verify-tag
          fi
