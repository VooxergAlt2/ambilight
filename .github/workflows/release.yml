name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.46.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  firmware-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Validate release candidate
        shell: bash
        run: bash tools/validate.sh

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          BUILD=.pio/build/esp32-c6-devkitc-1
          RELEASE=release
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          NOTES="docs/releases/${TAG}.md"

          test -f "$NOTES"
          mkdir -p "$RELEASE"

          cp "$BUILD/firmware.bin" "$RELEASE/firmware.bin"
          cp "$BUILD/firmware.factory.bin" "$RELEASE/firmware.factory.bin"
          cp "$BUILD/bootloader.bin" "$RELEASE/bootloader.bin"
          cp "$BUILD/partitions.bin" "$RELEASE/partitions.bin"
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" "$RELEASE/boot_app0.bin"

          (cd "$RELEASE" && sha256sum *.bin > SHA256SUMS.txt)
          ls -lh "$RELEASE"
          cat "$RELEASE/SHA256SUMS.txt"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          NOTES="docs/releases/${TAG}.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Ambilight ESP32-C6 ${TAG}" \
              --notes-file "$NOTES"
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "Ambilight ESP32-C6 ${TAG}" \
              --notes-file "$NOTES" \
              --verify-tag
          fi
