[platformio]
default_envs = esp32-c6-devkitc-1

[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; WT99P4C5-S1 deployment target exposes 16 MiB flash.
; Keep two 7 MiB application slots so a later OTA path does not require a
; destructive repartition. PlatformIO also enforces the per-slot image limit.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions/ambilight_16mb_ota.csv
board_upload.maximum_size = 7340032

monitor_speed = 115200
lib_deps =
    https://github.com/adafruit/Adafruit_VL53L5.git#1.0.1

; Normal runtime/performance build. Keep framework and LiteLED debug logging
; out of timing measurements; explicit Ambilight diagnostics remain available.
build_flags =
    -Wall
    -Wextra
    -Wpedantic
    -DCORE_DEBUG_LEVEL=0

; Stage 39 reset diagnostics are intentionally preserved as a separate build
; until the Stage 40 performance baseline is accepted on hardware.
[env:esp32-c6-devkitc-1-diag]
extends = env:esp32-c6-devkitc-1
build_flags =
    -Wall
    -Wextra
    -Wpedantic
    -DCORE_DEBUG_LEVEL=4

[env:native]
platform = native
test_framework = unity
; The vendored LiteLED runtime library is ESP32-specific. Native tests include
; only its pure bit-plane encoder header through the explicit include path.
lib_ignore =
    LiteLED
test_build_src = yes
build_src_filter =
    +<transport/DdpAssembler.cpp>
    +<tof/TofProcessor.cpp>
    +<tof/TofPlaneEstimator.cpp>
    +<tof/TofPlaneChangeGate.cpp>
    +<tof/TofPerimeterGainModel.cpp>
    +<tof/TofGainModel.cpp>
    +<tof/TofCalibrationCapture.cpp>
    +<render/RenderGainController.cpp>
    +<render/RenderScheduler.cpp>
    +<runtime/SerialCommandParser.cpp>
    +<runtime/RuntimePayloadParser.cpp>
    +<config/RuntimeSettings.cpp>
    +<network/WebUiProtocol.cpp>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wpedantic
    -Iinclude
    -Itest/support
    -Ilib/LiteLED/src
